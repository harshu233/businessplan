<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple E-Commerce Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f9f9f9;
      color: #333;
    }

    header {
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .products {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .product-card {
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 5px;
      width: 250px;
      padding: 15px;
      text-align: center;
      transition: box-shadow 0.3s;
    }

    .product-card:hover {
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .product-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 5px;
    }

    .product-name {
      margin: 15px 0 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .price {
      color: #e74c3c;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .add-to-cart {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 3px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #2c3e50;
      color: white;
      margin-top: 40px;
    }

    @media (max-width: 768px) {
      .products {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>GURUDEV TYRE</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">Cart</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <div class="container">
    <h2 style="text-align: center; margin-bottom: 30px;">Featured Products</h2>
    <div class="products">
      <div class="product-card">
        <img src="https://via.placeholder.com/250x200" alt="Product 1">
        <div class="product-name">Wireless Headphones</div>
        <div class="price">$49.99</div>
        <button class="add-to-cart">Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/250x200" alt="Product 2">
        <div class="product-name">appolo tyre</div>
        <div class="price">$89.99</div>
        <button class="add-to-cart">Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/250x200" alt="Product 3">
        <div class="product-name">Bluetooth Speaker</div>
        <div class="price">$39.99</div>
        <button class="add-to-cart">Add to Cart</button>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/250x200" alt="Product 4">
        <div class="product-name">Fitness Tracker</div>
        <div class="price">$59.99</div>
        <button class="add-to-cart">Add to Cart</button>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2025 ShopSmart. All rights reserved.
  </footer>

</body>
</html>
